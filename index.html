<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рекурсивная канбан-доска</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="shell">
    <section class="topbar">
      <div class="title-wrap">
        <div class="title-search-row">
          <h1>Рекурсивная канбан-доска</h1>
          <div class="search-wrap" id="searchWrap">
            <input class="search-input" id="searchInput" placeholder="Поиск задачи по названию или описанию" autocomplete="off" />
            <div class="search-results" id="searchResults"></div>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="stats-badge" id="stats">0 задач</div>
        <button class="icon-btn" id="menuBtn" title="Меню">⋯</button>
        <div class="menu" id="menu">
          <button class="button" id="exportBtn">Экспорт JSON</button>
          <button class="button" id="importBtn">Импорт JSON</button>
          <button class="button" id="addColumnBtn">Добавить столбец</button>
          <button class="button danger" id="resetBtn">Сбросить демо</button>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <nav class="toolbar-row crumbs" id="crumbs"></nav>
      <div class="toolbar-row composer">
        <input class="input" id="titleInput" placeholder="Название новой задачи" autocomplete="off" />
        <input class="input" id="descInput" placeholder="Короткое описание или заметка" autocomplete="off" />
        <button class="button primary" id="addBtn">Добавить задачу</button>
        <input type="file" id="fileInput" accept=".json,.txt,application/json,text/plain" />
      </div>
    </section>

    <section class="board" id="board"></section>
  </div>

  <script src="js/state.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
