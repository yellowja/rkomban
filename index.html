<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рекурсивная канбан-доска v7</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(18, 25, 46, 0.9);
      --panel-2: rgba(24, 32, 59, 0.95);
      --line: rgba(255, 255, 255, 0.09);
      --text: #eef3ff;
      --muted: #a8b3cf;
      --accent: #7c9cff;
      --accent-2: #8ef0d0;
      --planned: #7ea1ff;
      --progress: #ffbf69;
      --done: #77e4a1;
      --danger: #ff8b8b;
      --shadow: 0 20px 50px rgba(0,0,0,.35);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at -10% -10%, rgba(124,156,255,.18), transparent 55%),
        radial-gradient(1000px 600px at 110% 10%, rgba(142,240,208,.12), transparent 50%),
        linear-gradient(180deg, #09101d 0%, #0d1326 100%);
      overflow: hidden;
    }

    button, input { font: inherit; }

    .shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
      padding: 14px;
    }

    .topbar, .toolbar {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      backdrop-filter: blur(14px);
    }

    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      min-height: 82px;
    }

    .title-wrap { min-width: 0; flex: 1 1 auto; }
    .title-search-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }
    .title-search-row h1 {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .title-wrap h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .title-wrap p {
      margin: 6px 0 0;
      color: var(--muted);
      max-width: 980px;
      font-size: 13px;
    }

    .search-wrap {
      position: relative;
      margin-top: 0;
      max-width: none;
      flex: 1 1 420px;
      min-width: 260px;
      z-index: 80;
    }
    .search-input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.055);
      color: var(--text);
      outline: none;
      border-radius: 16px;
      padding: 10px 13px;
      font: inherit;
      font-size: 14px;
    }
    .search-input::placeholder { color: #8c98b8; }
    .search-input:focus {
      border-color: rgba(142,240,208,.42);
      background: rgba(255,255,255,.075);
    }
    .search-results {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      display: none;
      gap: 6px;
      max-height: 320px;
      overflow: auto;
      padding: 8px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(14, 20, 38, 0.98);
      box-shadow: var(--shadow);
      z-index: 90;
    }
    .search-results.open { display: grid; }
    .search-result {
      width: 100%;
      border: 1px solid transparent;
      background: rgba(255,255,255,.035);
      color: var(--text);
      border-radius: 13px;
      padding: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-result:hover {
      border-color: rgba(142,240,208,.28);
      background: rgba(255,255,255,.075);
    }
    .search-open-btn {
      flex: 1 1 auto;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      padding: 3px 4px;
      display: grid;
      gap: 3px;
    }
    .search-link-btn {
      flex: 0 0 auto;
      border: 1px solid rgba(142,240,208,.25);
      background: rgba(142,240,208,.08);
      color: #dffcf4;
      border-radius: 11px;
      padding: 7px 9px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    .search-link-btn:hover { background: rgba(142,240,208,.16); }
    .search-link-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      background: rgba(255,255,255,.035);
      color: var(--muted);
      border-color: var(--line);
    }
    .search-result-title { font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
    .search-result-meta { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .search-empty {
      color: var(--muted);
      font-size: 12px;
      padding: 9px 10px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      flex-shrink: 0;
    }

    .stats-badge, .badge {
      white-space: nowrap;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(124,156,255,.12);
      border: 1px solid rgba(124,156,255,.22);
      color: #dfe7ff;
      font-size: 13px;
    }

    .icon-btn, .button, .btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      transition: .18s ease;
    }
    .icon-btn:hover, .button:hover, .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.09);
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      line-height: 1;
    }
    .button, .btn {
      padding: 10px 13px;
      border-radius: 15px;
    }
    .button.primary, .btn.primary {
      background: linear-gradient(180deg, rgba(124,156,255,.26), rgba(124,156,255,.14));
      border-color: rgba(124,156,255,.34);
    }
    .button.good, .btn.good {
      background: linear-gradient(180deg, rgba(119,228,161,.2), rgba(119,228,161,.1));
      border-color: rgba(119,228,161,.28);
    }
    .button.danger, .btn.danger {
      background: linear-gradient(180deg, rgba(255,139,139,.2), rgba(255,139,139,.1));
      border-color: rgba(255,139,139,.28);
      color: #ffd7d7;
    }

    .menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 220px;
      padding: 8px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(14, 20, 38, 0.98);
      box-shadow: var(--shadow);
      display: none;
      z-index: 50;
    }
    .menu.open { display: grid; gap: 6px; }
    .menu .button, .menu .btn {
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      border-radius: 13px;
    }

    .toolbar {
      position: relative;
      z-index: 1;
      padding: 12px 14px;
      display: grid;
      gap: 10px;
    }
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .crumbs, .breadcrumbs { gap: 6px; }
    .crumbs button, .crumb {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: .18s ease;
      font-size: 13px;
    }
    .crumbs button:hover, .crumb:hover { transform: translateY(-1px); background: rgba(255,255,255,.07); }
    .crumb-sep { opacity: .45; color: var(--muted); }

    .composer, .creator {
      display: grid;
      grid-template-columns: 1.25fr 1.75fr auto auto;
      gap: 10px;
    }
    .composer input, .input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--text);
      outline: none;
      border-radius: 16px;
      padding: 11px 13px;
      font: inherit;
    }
    .composer input::placeholder, .input::placeholder { color: #8c98b8; }
    .composer input:focus, .input:focus { border-color: rgba(124,156,255,.42); background: rgba(255,255,255,.07); }
    .muted-note, .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      min-height: 17px;
    }

    .board {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .column {
      min-height: 0;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .column.drag-over { outline: 1px dashed rgba(124,156,255,.42); outline-offset: -8px; }
    .column-head, .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    }
    .column-title {
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
      font-size: 15px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(255,255,255,.04);
    }
    .dot.planned { background: var(--planned); }
    .dot.in_progress, .dot.progress { background: var(--progress); }
    .dot.done { background: var(--done); }
    .count {
      color: var(--muted);
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
    }
    .cards, .column-body {
      min-height: 0;
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .empty {
      min-height: 120px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(255,255,255,.09);
      border-radius: 20px;
      padding: 18px;
    }

    .card {
      position: relative;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.03));
      border-radius: 22px;
      padding: 13px;
      display: grid;
      gap: 9px;
      cursor: grab;
      user-select: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, opacity .18s ease;
    }
    .card:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.16);
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
    }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: .55; transform: rotate(1deg) scale(.99); }
    .card.link-card { border-style: dashed; }
    .card.highlighted {
      border-color: rgba(142,240,208,.8);
      box-shadow: 0 0 0 2px rgba(142,240,208,.18), 0 16px 34px rgba(0,0,0,.25);
      animation: highlightPulse 1.5s ease-in-out 2;
    }
    @keyframes highlightPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .card.drop-inside { outline: 2px solid rgba(142,240,208,.78); outline-offset: 3px; }
    .card.drop-before::before, .card.drop-after::after {
      content: '';
      position: absolute;
      left: 14px;
      right: 14px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
      box-shadow: 0 0 18px rgba(124,156,255,.45);
      pointer-events: none;
      z-index: 5;
    }
    .card.drop-before::before { top: -7px; }
    .card.drop-after::after { bottom: -7px; }

    .card-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
    .card-main { min-width: 0; cursor: pointer; padding-right: 36px; }
    .card-title { margin: 0; font-size: 16px; line-height: 1.25; letter-spacing: -0.015em; overflow-wrap: anywhere; }
    .card-desc { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .badges { display: flex; flex-wrap: wrap; gap: 7px; }
    .badge {
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--muted);
    }
    .badge.link { background: rgba(124,156,255,.12); border-color: rgba(124,156,255,.23); color: #dbe4ff; }

    .nest-zone {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(142,240,208,.36);
      background: rgba(142,240,208,.11);
      color: #c7ffef;
      font-size: 15px;
      opacity: 0;
      pointer-events: none;
      transform: scale(.92);
      transition: .16s ease;
      z-index: 10;
    }
    body.is-dragging .nest-zone { opacity: .42; pointer-events: auto; }
    body.is-dragging .card:hover .nest-zone, .nest-zone.over { opacity: 1; transform: scale(1); }
    .nest-zone::after {
      content: 'внутрь';
      position: absolute;
      right: 0;
      top: 34px;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(14,20,38,.96);
      color: var(--muted);
      border: 1px solid var(--line);
      font-size: 10px;
      opacity: 0;
      transform: translateY(-2px);
      white-space: nowrap;
      pointer-events: none;
    }
    .nest-zone.over::after { opacity: 1; transform: translateY(0); }

    .actions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-start; }
    .small {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 7px 9px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
    }
    .small:hover { background: rgba(255,255,255,.09); transform: translateY(-1px); }
    .small.delete { color: #ffd1d1; }
    input[type="file"] { display: none; }

    @media (max-width: 1050px) {
      body { overflow: auto; }
      .shell { height: auto; }
      .board { grid-template-columns: 1fr; }
      .composer, .creator { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .title-wrap { width: 100%; }
      .title-search-row { flex-direction: column; align-items: stretch; }
      .title-search-row h1 { white-space: normal; }
      .topbar-right { width: 100%; justify-content: space-between; }
      .search-wrap { width: 100%; max-width: none; flex-basis: auto; min-width: 0; }
      .card-main { padding-right: 0; }
      .nest-zone { top: 8px; right: 8px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="topbar">
      <div class="title-wrap">
        <div class="title-search-row">
          <h1>Рекурсивная канбан-доска</h1>
          <div class="search-wrap" id="searchWrap">
            <input class="search-input" id="searchInput" placeholder="Поиск задачи по названию или описанию" autocomplete="off" />
            <div class="search-results" id="searchResults"></div>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="stats-badge" id="stats">0 задач</div>
        <button class="icon-btn" id="menuBtn" title="Меню">⋯</button>
        <div class="menu" id="menu">
          <button class="button" id="exportBtn">Экспорт JSON</button>
          <button class="button" id="importBtn">Импорт JSON</button>
          <button class="button danger" id="resetBtn">Сбросить демо</button>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <nav class="toolbar-row crumbs" id="crumbs"></nav>
      <div class="toolbar-row composer">
        <input class="input" id="titleInput" placeholder="Название новой задачи" autocomplete="off" />
        <input class="input" id="descInput" placeholder="Короткое описание или заметка" autocomplete="off" />
        <button class="button primary" id="addBtn">Добавить задачу</button>
        <input type="file" id="fileInput" accept=".json,.txt,application/json,text/plain" />
      </div>
    </section>

    <section class="board" id="board"></section>
  </div>

  <script>
    'use strict';

    var STORAGE_KEY = 'recursive-kanban-board-v2';
    var STATUSES = {
      planned: { id: 'planned', title: 'Запланировано' },
      in_progress: { id: 'in_progress', title: 'В процессе' },
      done: { id: 'done', title: 'Сделано' }
    };

    var els = {};
    var state = null;
    var draggingId = null;
    var suppressNextClick = false;
    var highlightId = null;

    function taskHash(id) {
      return '#task=' + encodeURIComponent(id || 'root');
    }

    function taskIdFromLocation() {
      var hash = window.location.hash || '';
      var match = hash.match(/^#task=(.+)$/);
      if (!match) return null;
      try { return decodeURIComponent(match[1]); } catch (err) { return null; }
    }

    function validBoardId(id) {
      var t = id ? getTask(id) : null;
      if (!t || isLinkTask(t)) return state ? state.rootId : 'root';
      return t.id;
    }

    function updateBrowserHistory(mode) {
      if (!window.history || !state) return;
      var id = validBoardId(state.currentId);
      var url = taskHash(id);
      var payload = { currentId: id };
      if (mode === 'replace') {
        window.history.replaceState(payload, '', url);
      } else if (window.location.hash !== url) {
        window.history.pushState(payload, '', url);
      } else {
        window.history.replaceState(payload, '', url);
      }
    }

    function navigateToTask(id, options) {
      options = options || {};
      state.currentId = validBoardId(id);
      persist();
      if (!options.fromPop) updateBrowserHistory(options.replace ? 'replace' : 'push');
      render(options.renderOptions);
    }

    function now() { return Date.now(); }
    function uid() { state.nextId = (state.nextId || 1) + 1; return 'task_' + state.nextId; }
    function isRoot(id) { return id === state.rootId; }
    function isLinkTask(task) { return !!(task && task.type === 'link' && task.targetId); }
    function getTask(id) { return state.tasks[id] || null; }
    function realId(id) { var t = getTask(id); return isLinkTask(t) ? t.targetId : id; }
    function realTask(id) { return getTask(realId(id)); }
    function safeText(value) { return value === undefined || value === null ? '' : String(value); }

    function createDemoState() {
      var s = {
        rootId: 'root',
        currentId: 'root',
        nextId: 6,
        tasks: {
          root: {
            id: 'root', parentId: null, title: 'Главная доска', description: 'Корневой уровень',
            status: 'planned', manualDone: false, manualInProgress: false,
            children: ['task_1', 'task_4'], createdAt: now(), updatedAt: now()
          },
          task_1: {
            id: 'task_1', parentId: 'root', title: 'Сварить борщ', description: 'Большая задача с подготовительными шагами',
            status: 'planned', manualDone: false, manualInProgress: false,
            children: ['task_2', 'task_3'], createdAt: now(), updatedAt: now()
          },
          task_2: {
            id: 'task_2', parentId: 'task_1', title: 'Купить продукты', description: '',
            status: 'planned', manualDone: false, manualInProgress: false,
            children: [], createdAt: now(), updatedAt: now()
          },
          task_3: {
            id: 'task_3', parentId: 'task_1', title: 'Помыть овощи', description: '',
            status: 'planned', manualDone: false, manualInProgress: false,
            children: [], createdAt: now(), updatedAt: now()
          },
          task_4: {
            id: 'task_4', parentId: 'root', title: 'Поиск работы', description: '',
            status: 'planned', manualDone: false, manualInProgress: false,
            children: ['task_5'], createdAt: now(), updatedAt: now()
          },
          task_5: {
            id: 'task_5', parentId: 'task_4', title: 'Составить резюме', description: '',
            status: 'planned', manualDone: false, manualInProgress: false,
            children: [], createdAt: now(), updatedAt: now()
          },
          task_6: {
            id: 'task_6', parentId: 'root', title: 'Пр', description: '',
            status: 'planned', manualDone: false, manualInProgress: false,
            children: [], createdAt: now(), updatedAt: now()
          }
        }
      };
      s.tasks.root.children.push('task_6');
      return s;
    }

    function normalizeState(input) {
      var fallback = createDemoState();
      if (!input || typeof input !== 'object' || !input.tasks || typeof input.tasks !== 'object') return fallback;

      var s = {
        rootId: input.rootId || 'root',
        currentId: input.currentId || input.rootId || 'root',
        nextId: Number(input.nextId || 1),
        tasks: input.tasks
      };

      if (!s.tasks[s.rootId]) {
        s.tasks[s.rootId] = fallback.tasks.root;
      }

      Object.keys(s.tasks).forEach(function(id) {
        var t = s.tasks[id];
        if (!t || typeof t !== 'object') {
          delete s.tasks[id];
          return;
        }
        t.id = t.id || id;
        if (!Array.isArray(t.children)) t.children = [];
        t.children = t.children.filter(function(childId) { return !!s.tasks[childId]; });
        t.title = safeText(t.title || (isLinkTask(t) ? 'Ссылка' : 'Без названия'));
        t.description = safeText(t.description);
        t.status = ['planned', 'in_progress', 'done'].indexOf(t.status) >= 0 ? t.status : 'planned';
        t.manualDone = !!t.manualDone;
        t.manualInProgress = !!t.manualInProgress;
        t.createdAt = t.createdAt || now();
        t.updatedAt = t.updatedAt || now();
        if (isLinkTask(t) && !s.tasks[t.targetId]) delete s.tasks[id];
      });

      Object.keys(s.tasks).forEach(function(id) {
        var t = s.tasks[id];
        if (!t) return;
        t.children = t.children.filter(function(childId) { return !!s.tasks[childId] && childId !== id; });
        if (id !== s.rootId && !t.parentId) t.parentId = s.rootId;
      });

      Object.keys(s.tasks).forEach(function(id) {
        var t = s.tasks[id];
        if (id === s.rootId || !t || !t.parentId || !s.tasks[t.parentId]) return;
        var parent = s.tasks[t.parentId];
        if (parent.children.indexOf(id) < 0) parent.children.push(id);
      });

      state = s;
      if (!getTask(state.currentId) || isLinkTask(getTask(state.currentId))) state.currentId = state.rootId;
      recalcAll(false);
      return state;
    }

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return normalizeState(JSON.parse(raw));
      } catch (err) {
        console.warn('Не удалось загрузить localStorage:', err);
      }
      state = createDemoState();
      recalcAll(false);
      return state;
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function effectiveStatus(itemId) {
      var t = getTask(itemId);
      if (!t) return 'planned';
      if (isLinkTask(t)) {
        var target = getTask(t.targetId);
        return target ? target.status : 'planned';
      }
      return t.status || 'planned';
    }

    function effectiveTitle(itemId) {
      var t = getTask(itemId);
      if (!t) return 'Удалённая задача';
      if (isLinkTask(t)) {
        var target = getTask(t.targetId);
        return target ? target.title : 'Удалённая ссылка';
      }
      return t.title;
    }

    function effectiveDescription(itemId) {
      var t = getTask(itemId);
      if (!t) return '';
      if (isLinkTask(t)) {
        var target = getTask(t.targetId);
        return target ? target.description : '';
      }
      return t.description || '';
    }

    function effectiveChildrenCount(itemId) {
      var t = realTask(itemId);
      return t && Array.isArray(t.children) ? t.children.length : 0;
    }

    function doneChildrenCount(itemId) {
      var t = realTask(itemId);
      if (!t || !Array.isArray(t.children)) return 0;
      return t.children.filter(function(childId) { return effectiveStatus(childId) === 'done'; }).length;
    }

    function allRealTaskIds() {
      return Object.keys(state.tasks).filter(function(id) { return !isLinkTask(state.tasks[id]); });
    }

    function recalcOne(task) {
      if (!task || isLinkTask(task) || isRoot(task.id)) {
        if (!task || isLinkTask(task)) return false;
      }

      if (task.manualDone) {
        if (task.status !== 'done') { task.status = 'done'; task.updatedAt = now(); return true; }
        return false;
      }

      if (!Array.isArray(task.children) || task.children.length === 0) return false;

      var desired = task.manualInProgress ? 'in_progress' : 'planned';
      var hasActiveChild = task.children.some(function(childId) { return effectiveStatus(childId) !== 'planned'; });
      if (hasActiveChild) desired = 'in_progress';

      if (task.status !== desired) {
        task.status = desired;
        task.updatedAt = now();
        return true;
      }
      return false;
    }

    function recalcAll(shouldPersist) {
      var changed = false;
      for (var pass = 0; pass < 50; pass += 1) {
        var changedThisPass = false;
        allRealTaskIds().forEach(function(id) {
          if (recalcOne(getTask(id))) changedThisPass = true;
        });
        changed = changed || changedThisPass;
        if (!changedThisPass) break;
      }
      if (shouldPersist !== false) persist();
      return changed;
    }

    function markDoneRecursive(id, visited) {
      visited = visited || {};
      var targetId = realId(id);
      if (visited[targetId]) return;
      visited[targetId] = true;

      var t = getTask(targetId);
      if (!t || isLinkTask(t)) return;
      t.status = 'done';
      t.manualDone = true;
      t.manualInProgress = false;
      t.updatedAt = now();

      t.children.forEach(function(childId) {
        markDoneRecursive(childId, visited);
      });
    }

    function applyItemStatus(itemId, status) {
      var id = realId(itemId);
      var t = getTask(id);
      if (!t || isLinkTask(t) || isRoot(id)) return;

      if (status === 'done') {
        markDoneRecursive(id, {});
      } else {
        t.status = status;
        t.manualDone = false;
        t.manualInProgress = status === 'in_progress';
        t.updatedAt = now();
      }
    }

    function setItemStatus(itemId, status) {
      applyItemStatus(itemId, status);
      recalcAll(true);
      render();
    }

    function createTask(title, description, parentId) {
      var id = uid();
      state.tasks[id] = {
        id: id,
        parentId: parentId,
        title: title,
        description: description || '',
        status: 'planned',
        manualDone: false,
        manualInProgress: false,
        children: [],
        createdAt: now(),
        updatedAt: now()
      };
      getTask(parentId).children.push(id);
      recalcAll(true);
      return state.tasks[id];
    }

    function createLinkTask(targetId, parentId) {
      if (!getTask(targetId) || isLinkTask(getTask(targetId))) throw new Error('Можно ссылаться только на обычную задачу.');
      if (targetId === state.rootId) throw new Error('На корневую доску ссылку создавать нельзя.');
      var id = uid();
      state.tasks[id] = {
        id: id,
        type: 'link',
        targetId: targetId,
        parentId: parentId,
        title: '',
        description: '',
        status: 'planned',
        manualDone: false,
        manualInProgress: false,
        children: [],
        createdAt: now(),
        updatedAt: now()
      };
      getTask(parentId).children.push(id);
      recalcAll(true);
      return state.tasks[id];
    }

    function removeFromParent(itemId) {
      var t = getTask(itemId);
      if (!t || !t.parentId || !getTask(t.parentId)) return;
      var parent = getTask(t.parentId);
      parent.children = parent.children.filter(function(id) { return id !== itemId; });
      parent.updatedAt = now();
    }

    function insertIntoParent(itemId, parentId, index) {
      var item = getTask(itemId);
      var parent = getTask(parentId);
      if (!item || !parent || itemId === state.rootId) return false;
      removeFromParent(itemId);
      item.parentId = parentId;
      if (!Number.isFinite(index)) index = parent.children.length;
      index = Math.max(0, Math.min(index, parent.children.length));
      parent.children.splice(index, 0, itemId);
      item.updatedAt = now();
      parent.updatedAt = now();
      return true;
    }

    function attachToParent(itemId, parentId) {
      return insertIntoParent(itemId, parentId, getTask(parentId) ? getTask(parentId).children.length : 0);
    }

    function isAncestor(ancestorId, maybeChildId) {
      var current = getTask(maybeChildId);
      while (current && current.parentId) {
        if (current.parentId === ancestorId) return true;
        current = getTask(current.parentId);
      }
      return false;
    }

    function canMoveInside(itemId, targetContainerId) {
      if (!itemId || !targetContainerId || itemId === targetContainerId) return false;
      if (isRoot(itemId)) return false;
      var item = getTask(itemId);
      var target = getTask(targetContainerId);
      if (!item || !target || isLinkTask(target)) return false;
      if (!isLinkTask(item) && isAncestor(itemId, targetContainerId)) return false;
      return true;
    }

    function moveToColumn(itemId, status, referenceId, placement) {
      var item = getTask(itemId);
      var parent = getTask(state.currentId);
      if (!item || !parent || isRoot(itemId)) return;
      if (referenceId && referenceId === itemId) return;

      applyItemStatus(itemId, status);
      removeFromParent(itemId);
      item.parentId = state.currentId;

      var index = parent.children.length;
      if (referenceId && parent.children.indexOf(referenceId) >= 0) {
        var refIndex = parent.children.indexOf(referenceId);
        index = placement === 'after' ? refIndex + 1 : refIndex;
      } else {
        var lastSameStatusIndex = -1;
        parent.children.forEach(function(childId, childIndex) {
          if (effectiveStatus(childId) === status) lastSameStatusIndex = childIndex;
        });
        index = lastSameStatusIndex >= 0 ? lastSameStatusIndex + 1 : parent.children.length;
      }

      parent.children.splice(index, 0, itemId);
      item.updatedAt = now();
      parent.updatedAt = now();
      recalcAll(true);
      render({ preserveScroll: true });
    }

    function moveInside(itemId, targetItemId) {
      var targetContainerId = realId(targetItemId);
      if (!canMoveInside(itemId, targetContainerId)) {
        return;
      }
      applyItemStatus(itemId, 'planned');
      attachToParent(itemId, targetContainerId);
      recalcAll(true);
      render({ preserveScroll: true });
    }

    function taskPath(id) {
      var path = [];
      var current = getTask(id);
      var guard = 0;
      while (current && guard < 200) {
        path.unshift(current.title || 'Без названия');
        if (!current.parentId) break;
        current = getTask(current.parentId);
        guard += 1;
      }
      return path.join(' / ');
    }

    function addTaskFromInputs() {
      var title = els.titleInput.value.trim();
      var description = els.descInput.value.trim();
      if (!title) return;
      createTask(title, description, state.currentId);
      els.titleInput.value = '';
      els.descInput.value = '';
      render();
      els.titleInput.focus();
    }

    function addLinkTaskFromPrompt() {
      var query = prompt('Введи часть названия задачи, на которую нужна ссылка:');
      if (query === null) return;
      var q = query.trim().toLowerCase();
      if (!q) return;

      var matches = Object.values(state.tasks).filter(function(t) {
        return t && !isRoot(t.id) && !isLinkTask(t) && t.id !== state.currentId;
      }).filter(function(t) {
        return safeText(t.title).toLowerCase().indexOf(q) >= 0 || safeText(t.description).toLowerCase().indexOf(q) >= 0;
      }).slice(0, 12);

      if (!matches.length) {
        alert('Не нашла задач по такому запросу. Попробуй другое слово из названия.');
        return;
      }

      var sep = String.fromCharCode(10);
      var list = matches.map(function(t, i) { return String(i + 1) + '. ' + taskPath(t.id); }).join(sep);
      var chosen = prompt('Выбери номер задачи для ссылки:' + sep + sep + list);
      if (chosen === null) return;
      var idx = Number(chosen.trim()) - 1;
      if (!Number.isInteger(idx) || !matches[idx]) {
        alert('Неверный номер.');
        return;
      }
      createLinkTask(matches[idx].id, state.currentId);
      render();
    }

    function deleteTaskTree(itemId, visited) {
      visited = visited || {};
      var t = getTask(itemId);
      if (!t || visited[itemId] || isRoot(itemId)) return;
      visited[itemId] = true;

      if (isLinkTask(t)) {
        removeFromParent(itemId);
        delete state.tasks[itemId];
        return;
      }

      var children = t.children.slice();
      children.forEach(function(childId) { deleteTaskTree(childId, visited); });

      Object.keys(state.tasks).forEach(function(id) {
        var other = state.tasks[id];
        if (isLinkTask(other) && other.targetId === itemId) {
          removeFromParent(id);
          delete state.tasks[id];
        }
      });

      removeFromParent(itemId);
      delete state.tasks[itemId];
      if (state.currentId === itemId) state.currentId = state.rootId;
    }

    function deleteItem(itemId) {
      var t = getTask(itemId);
      if (!t || isRoot(itemId)) return;
      var label = isLinkTask(t) ? 'Удалить эту ссылку? Оригинальная задача останется.' : 'Удалить задачу вместе со всеми вложенными задачами и ссылками на неё?';
      if (!confirm(label)) return;
      deleteTaskTree(itemId, {});
      recalcAll(true);
      render();
    }

    function editItem(itemId) {
      var id = realId(itemId);
      var t = getTask(id);
      if (!t || isRoot(id)) return;
      var title = prompt('Название задачи:', t.title || '');
      if (title === null) return;
      title = title.trim();
      if (!title) return;
      var desc = prompt('Описание:', t.description || '');
      if (desc === null) return;
      t.title = title;
      t.description = desc;
      t.updatedAt = now();
      persist();
      render();
    }

    function openTask(itemId) {
      var id = realId(itemId);
      var t = getTask(id);
      if (!t || isLinkTask(t)) return;
      navigateToTask(id);
    }

    function hideSearchResults() {
      if (els.searchResults) els.searchResults.classList.remove('open');
    }

    function searchMatches(query) {
      var q = safeText(query).trim().toLowerCase();
      if (!q) return [];
      return Object.values(state.tasks).filter(function(t) {
        return t && !isRoot(t.id) && !isLinkTask(t);
      }).filter(function(t) {
        return safeText(t.title).toLowerCase().indexOf(q) >= 0 || safeText(t.description).toLowerCase().indexOf(q) >= 0;
      }).sort(function(a, b) {
        var aTitle = safeText(a.title).toLowerCase();
        var bTitle = safeText(b.title).toLowerCase();
        var aStarts = aTitle.indexOf(q) === 0 ? 0 : 1;
        var bStarts = bTitle.indexOf(q) === 0 ? 0 : 1;
        if (aStarts !== bStarts) return aStarts - bStarts;
        return aTitle.localeCompare(bTitle, 'ru');
      }).slice(0, 12);
    }

    function revealTaskFromSearch(taskId) {
      var t = getTask(taskId);
      if (!t || isRoot(taskId)) return;
      highlightId = taskId;
      hideSearchResults();
      if (els.searchInput) els.searchInput.blur();
      navigateToTask(t.parentId || state.rootId);
    }

    function canCreateLinkTo(targetId) {
      var target = getTask(targetId);
      var current = getTask(state.currentId);
      if (!target || !current) return false;
      if (isRoot(targetId) || isLinkTask(target)) return false;
      if (targetId === state.currentId) return false;
      return !current.children.some(function(childId) { return realId(childId) === targetId; });
    }

    function addSearchLink(targetId) {
      if (!canCreateLinkTo(targetId)) {
        alert('Сюда уже нельзя добавить такую ссылку: задача либо уже есть на этой доске, либо это текущая открытая задача.');
        return;
      }
      var link = createLinkTask(targetId, state.currentId);
      highlightId = link.id;
      hideSearchResults();
      if (els.searchInput) els.searchInput.blur();
      render({ preserveScroll: true });
    }

    function renderSearchResults() {
      if (!els.searchInput || !els.searchResults) return;
      var matches = searchMatches(els.searchInput.value);
      els.searchResults.innerHTML = '';
      if (!els.searchInput.value.trim()) {
        hideSearchResults();
        return;
      }
      if (!matches.length) {
        var empty = document.createElement('div');
        empty.className = 'search-empty';
        empty.textContent = 'Ничего не найдено';
        els.searchResults.appendChild(empty);
        els.searchResults.classList.add('open');
        return;
      }
      matches.forEach(function(t) {
        var row = document.createElement('div');
        row.className = 'search-result';

        var openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'search-open-btn';

        var title = document.createElement('div');
        title.className = 'search-result-title';
        title.textContent = t.title || 'Без названия';
        var meta = document.createElement('div');
        meta.className = 'search-result-meta';
        var statusTitle = STATUSES[t.status] ? STATUSES[t.status].title : t.status;
        meta.textContent = statusTitle + ' • ' + taskPath(t.id);
        openBtn.appendChild(title);
        openBtn.appendChild(meta);
        openBtn.addEventListener('click', function(ev) {
          ev.stopPropagation();
          revealTaskFromSearch(t.id);
        });

        var linkBtn = document.createElement('button');
        linkBtn.type = 'button';
        linkBtn.className = 'search-link-btn';
        linkBtn.textContent = '+ ссылка';
        if (!canCreateLinkTo(t.id)) {
          linkBtn.disabled = true;
          linkBtn.title = 'Эту задачу нельзя добавить ссылкой на текущую доску';
        } else {
          linkBtn.title = 'Добавить ссылку на текущую доску';
          linkBtn.addEventListener('click', function(ev) {
            ev.stopPropagation();
            addSearchLink(t.id);
          });
        }

        row.appendChild(openBtn);
        row.appendChild(linkBtn);
        els.searchResults.appendChild(row);
      });
      els.searchResults.classList.add('open');
    }

    function buildBreadcrumbs() {
      els.crumbs.innerHTML = '';
      var chain = [];
      var current = getTask(state.currentId);
      var guard = 0;
      while (current && guard < 200) {
        chain.unshift(current);
        if (!current.parentId) break;
        current = getTask(current.parentId);
        guard += 1;
      }
      chain.forEach(function(t, i) {
        if (i > 0) {
          var sep = document.createElement('span');
          sep.className = 'crumb-sep';
          sep.textContent = '/';
          els.crumbs.appendChild(sep);
        }
        var btn = document.createElement('button');
        btn.textContent = isRoot(t.id) ? 'Главная' : t.title;
        btn.addEventListener('click', function() { navigateToTask(t.id); });
        els.crumbs.appendChild(btn);
      });
    }

    function makeButton(text, className, handler) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'small ' + (className || '');
      btn.textContent = text;
      btn.draggable = false;
      btn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        handler();
      });
      return btn;
    }

    function clearDropMarkers() {
      document.querySelectorAll('.drop-inside, .drop-before, .drop-after').forEach(function(el) {
        el.classList.remove('drop-inside', 'drop-before', 'drop-after');
      });
      document.querySelectorAll('.nest-zone.over').forEach(function(el) { el.classList.remove('over'); });
    }

    function captureScrollState() {
      var snapshot = { columns: {}, windowY: window.scrollY || document.documentElement.scrollTop || 0 };
      document.querySelectorAll('.column').forEach(function(column) {
        var status = column.dataset.status;
        var cards = column.querySelector('.cards');
        if (status && cards) snapshot.columns[status] = cards.scrollTop;
      });
      return snapshot;
    }

    function restoreScrollState(snapshot) {
      if (!snapshot) return;
      requestAnimationFrame(function() {
        Object.keys(snapshot.columns || {}).forEach(function(status) {
          var cards = document.querySelector('.column[data-status="' + status + '"] .cards');
          if (cards) cards.scrollTop = snapshot.columns[status];
        });
        if (typeof snapshot.windowY === 'number') window.scrollTo(window.scrollX || 0, snapshot.windowY);
      });
    }

    function scrollToHighlightedCard() {
      if (!highlightId) return;
      requestAnimationFrame(function() {
        var card = document.querySelector('.card[data-id="' + highlightId + '"]');
        if (!card) return;
        card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        setTimeout(function() {
          card.classList.remove('highlighted');
          if (highlightId === card.dataset.id) highlightId = null;
        }, 3200);
      });
    }

    function getDropPosition(ev, card) {
      var rect = card.getBoundingClientRect();
      return ev.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
    }

    function renderCard(itemId) {
      var item = getTask(itemId);
      if (!item) return null;
      var target = realTask(itemId);

      var card = document.createElement('article');
      card.className = 'card' + (isLinkTask(item) ? ' link-card' : '') + (itemId === highlightId ? ' highlighted' : '');
      card.draggable = !isRoot(itemId);
      card.dataset.id = itemId;

      card.addEventListener('click', function(ev) {
        if (suppressNextClick) return;
        if (ev.target.closest('button') || ev.target.closest('.nest-zone')) return;
        openTask(itemId);
      });

      card.addEventListener('dragstart', function(ev) {
        draggingId = itemId;
        suppressNextClick = true;
        card.classList.add('dragging');
        document.body.classList.add('is-dragging');
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', itemId);
      });
      card.addEventListener('dragend', function() {
        draggingId = null;
        card.classList.remove('dragging');
        document.body.classList.remove('is-dragging');
        clearDropMarkers();
        setTimeout(function() { suppressNextClick = false; }, 120);
      });
      card.addEventListener('dragover', function(ev) {
        if (!draggingId || draggingId === itemId || ev.target.closest('.nest-zone')) return;
        ev.preventDefault();
        ev.stopPropagation();
        clearDropMarkers();
        var position = getDropPosition(ev, card);
        card.classList.add(position === 'before' ? 'drop-before' : 'drop-after');
        ev.dataTransfer.dropEffect = 'move';
      });
      card.addEventListener('dragleave', function(ev) {
        if (!card.contains(ev.relatedTarget)) {
          card.classList.remove('drop-before', 'drop-after');
        }
      });
      card.addEventListener('drop', function(ev) {
        if (ev.target.closest('.nest-zone')) return;
        ev.preventDefault();
        ev.stopPropagation();
        var dragged = ev.dataTransfer.getData('text/plain') || draggingId;
        var position = card.classList.contains('drop-before') ? 'before' : 'after';
        clearDropMarkers();
        if (dragged && dragged !== itemId) moveToColumn(dragged, effectiveStatus(itemId), itemId, position);
      });

      var nestZone = document.createElement('div');
      nestZone.className = 'nest-zone';
      nestZone.title = 'Вложить перетаскиваемую задачу внутрь этой';
      nestZone.textContent = '↘';
      nestZone.addEventListener('click', function(ev) { ev.stopPropagation(); });
      nestZone.addEventListener('dragover', function(ev) {
        if (!draggingId || draggingId === itemId) return;
        var containerId = realId(itemId);
        if (!canMoveInside(draggingId, containerId)) return;
        ev.preventDefault();
        ev.stopPropagation();
        clearDropMarkers();
        nestZone.classList.add('over');
        card.classList.add('drop-inside');
        ev.dataTransfer.dropEffect = 'move';
      });
      nestZone.addEventListener('dragleave', function() {
        nestZone.classList.remove('over');
        card.classList.remove('drop-inside');
      });
      nestZone.addEventListener('drop', function(ev) {
        ev.preventDefault();
        ev.stopPropagation();
        var dragged = ev.dataTransfer.getData('text/plain') || draggingId;
        clearDropMarkers();
        if (dragged) moveInside(dragged, itemId);
      });
      card.appendChild(nestZone);

      var top = document.createElement('div');
      top.className = 'card-top';

      var content = document.createElement('div');
      content.className = 'card-main';
      var title = document.createElement('h3');
      title.className = 'card-title';
      title.textContent = effectiveTitle(itemId);
      content.appendChild(title);

      var descText = effectiveDescription(itemId);
      if (descText) {
        var desc = document.createElement('p');
        desc.className = 'card-desc';
        desc.textContent = descText;
        content.appendChild(desc);
      }

      top.appendChild(content);
      card.appendChild(top);

      var badges = document.createElement('div');
      badges.className = 'badges';
      if (isLinkTask(item)) {
        var linkBadge = document.createElement('span');
        linkBadge.className = 'badge link';
        linkBadge.textContent = 'ссылка';
        badges.appendChild(linkBadge);
      }
      var childrenCount = effectiveChildrenCount(itemId);
      if (childrenCount > 0) {
        var childBadge = document.createElement('span');
        childBadge.className = 'badge';
        childBadge.textContent = String(doneChildrenCount(itemId)) + '/' + String(childrenCount) + ' внутри';
        badges.appendChild(childBadge);
      }
      if (target && target.manualDone && target.status === 'done') {
        var doneBadge = document.createElement('span');
        doneBadge.className = 'badge';
        doneBadge.textContent = 'вручную завершено';
        badges.appendChild(doneBadge);
      }
      if (badges.children.length) card.appendChild(badges);

      var actions = document.createElement('div');
      actions.className = 'actions';
      actions.appendChild(makeButton('Изм.', '', function() { editItem(itemId); }));
      actions.appendChild(makeButton('Удалить', 'delete', function() { deleteItem(itemId); }));
      card.appendChild(actions);

      return card;
    }

    function renderColumn(statusId) {
      var column = document.createElement('section');
      column.className = 'column';
      column.dataset.status = statusId;

      column.addEventListener('dragover', function(ev) {
        if (!draggingId) return;
        if (ev.target.closest('.card')) return;
        ev.preventDefault();
        clearDropMarkers();
        column.classList.add('drag-over');
        ev.dataTransfer.dropEffect = 'move';
      });
      column.addEventListener('dragleave', function(ev) {
        if (!column.contains(ev.relatedTarget)) column.classList.remove('drag-over');
      });
      column.addEventListener('drop', function(ev) {
        if (ev.target.closest('.card')) return;
        ev.preventDefault();
        column.classList.remove('drag-over');
        clearDropMarkers();
        var dragged = ev.dataTransfer.getData('text/plain') || draggingId;
        if (dragged) moveToColumn(dragged, statusId, null, 'after');
      });

      var head = document.createElement('div');
      head.className = 'column-head';
      var title = document.createElement('div');
      title.className = 'column-title';
      var dot = document.createElement('span');
      dot.className = 'dot ' + statusId;
      title.appendChild(dot);
      title.appendChild(document.createTextNode(STATUSES[statusId].title));
      var count = document.createElement('span');
      count.className = 'count';
      head.appendChild(title);
      head.appendChild(count);
      column.appendChild(head);

      var cards = document.createElement('div');
      cards.className = 'cards';
      var current = getTask(state.currentId);
      var children = current && Array.isArray(current.children) ? current.children.slice() : [];
      var filtered = children.filter(function(id) { return effectiveStatus(id) === statusId; });
      count.textContent = String(filtered.length);

      if (!filtered.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Пока пусто';
        cards.appendChild(empty);
      } else {
        filtered.forEach(function(id) {
          var card = renderCard(id);
          if (card) cards.appendChild(card);
        });
      }
      column.appendChild(cards);
      return column;
    }

    function renderStats() {
      var tasks = Object.values(state.tasks);
      var realTasks = tasks.filter(function(t) { return t && !isLinkTask(t) && !isRoot(t.id); });
      var links = tasks.filter(function(t) { return isLinkTask(t); });
      var done = realTasks.filter(function(t) { return t.status === 'done'; }).length;
      els.stats.textContent = String(realTasks.length) + ' задач • ' + String(done) + ' сделано • ' + String(links.length) + ' ссылок';
    }

    function render(options) {
      var scrollSnapshot = options && options.preserveScroll ? captureScrollState() : null;
      if (!getTask(state.currentId) || isLinkTask(getTask(state.currentId))) state.currentId = state.rootId;
      buildBreadcrumbs();
      renderStats();
      els.board.innerHTML = '';
      ['planned', 'in_progress', 'done'].forEach(function(statusId) {
        els.board.appendChild(renderColumn(statusId));
      });
      restoreScrollState(scrollSnapshot);
      scrollToHighlightedCard();
    }

    function exportState() {
      recalcAll(false);
      var data = JSON.stringify(state, null, 2);
      var blob = new Blob([data], { type: 'application/json;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'recursive-kanban-board.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
    }

    function importStateFromFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        try {
          var parsed = JSON.parse(String(reader.result));
          state = normalizeState(parsed);
          persist();
          render();
          alert('Импортировано.');
        } catch (err) {
          alert('Не удалось импортировать JSON: ' + (err && err.message ? err.message : err));
        }
      };
      reader.readAsText(file);
    }

    function resetDemo() {
      if (!confirm('Сбросить текущую доску и открыть демо? Экспортируй данные заранее, если они нужны.')) return;
      state = createDemoState();
      recalcAll(true);
      render();
    }

    function bindUi() {
      els.stats = document.getElementById('stats');
      els.searchWrap = document.getElementById('searchWrap');
      els.searchInput = document.getElementById('searchInput');
      els.searchResults = document.getElementById('searchResults');
      els.menuBtn = document.getElementById('menuBtn');
      els.menu = document.getElementById('menu');
      els.crumbs = document.getElementById('crumbs');
      els.board = document.getElementById('board');
      els.titleInput = document.getElementById('titleInput');
      els.descInput = document.getElementById('descInput');
      els.addBtn = document.getElementById('addBtn');
      els.exportBtn = document.getElementById('exportBtn');
      els.importBtn = document.getElementById('importBtn');
      els.resetBtn = document.getElementById('resetBtn');
      els.fileInput = document.getElementById('fileInput');

      els.menuBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        els.menu.classList.toggle('open');
      });
      document.addEventListener('click', function() { els.menu.classList.remove('open'); hideSearchResults(); });
      els.menu.addEventListener('click', function(ev) { ev.stopPropagation(); });

      els.searchWrap.addEventListener('click', function(ev) { ev.stopPropagation(); });
      els.searchInput.addEventListener('input', renderSearchResults);
      els.searchInput.addEventListener('focus', renderSearchResults);
      els.searchInput.addEventListener('keydown', function(ev) {
        if (ev.key === 'Escape') {
          hideSearchResults();
          els.searchInput.blur();
        }
        if (ev.key === 'Enter') {
          var first = searchMatches(els.searchInput.value)[0];
          if (first) revealTaskFromSearch(first.id);
        }
      });

      els.addBtn.addEventListener('click', addTaskFromInputs);
      els.titleInput.addEventListener('keydown', function(ev) { if (ev.key === 'Enter') addTaskFromInputs(); });
      els.descInput.addEventListener('keydown', function(ev) { if (ev.key === 'Enter') addTaskFromInputs(); });
      els.exportBtn.addEventListener('click', exportState);
      els.importBtn.addEventListener('click', function() { els.fileInput.click(); });
      els.fileInput.addEventListener('change', function(ev) {
        importStateFromFile(ev.target.files[0]);
        ev.target.value = '';
      });
      els.resetBtn.addEventListener('click', resetDemo);
    }

    document.addEventListener('DOMContentLoaded', function() {
      bindUi();
      loadState();
      var urlTaskId = taskIdFromLocation();
      if (urlTaskId && getTask(urlTaskId) && !isLinkTask(getTask(urlTaskId))) {
        state.currentId = urlTaskId;
        persist();
      }
      updateBrowserHistory('replace');
      render();

      window.addEventListener('popstate', function(ev) {
        var id = ev.state && ev.state.currentId ? ev.state.currentId : taskIdFromLocation();
        state.currentId = validBoardId(id);
        persist();
        render();
      });
    });
  </script>
</body>
</html>
